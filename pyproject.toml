[project]
name = "tospesa"
version = "0.1.0"
description = "Réseau de confiance personnel et décentralisé"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
]

[project.scripts]
tospesa = "tospesa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tospesa"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
